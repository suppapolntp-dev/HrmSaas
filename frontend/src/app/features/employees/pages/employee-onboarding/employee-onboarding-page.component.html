<div class="page-stack">
  <header class="page-header">
    <div class="page-heading">
      <h1 class="page-title">รับพนักงานใหม่ (Onboarding)</h1>
      <p class="page-subtitle">สร้างข้อมูลพนักงาน สัญญาจ้าง โควตาวันลาเริ่มต้น และบัญชีผู้ใช้ในขั้นตอนเดียว</p>
    </div>

    <div class="header-actions">
      <a routerLink="/employees/list" class="btn-secondary focus-ring link-btn">กลับรายชื่อพนักงาน</a>
    </div>
  </header>

  <app-state-container
    [isLoading]="isLoading()"
    [isEmpty]="branches().length === 0 || departments().length === 0"
    [errorMessage]="errorMessage()"
    errorTitle="ไม่สามารถโหลดข้อมูลตั้งต้นได้"
    emptyTitle="ยังไม่มีสาขาหรือแผนกในบริษัทนี้"
    emptyDescription="กรุณาสร้างสาขา แผนก ตำแหน่ง และระดับพนักงานให้เรียบร้อยก่อน"
    [skeletonRows]="6"
    (retry)="loadLookups()"
  >
    <form class="surface-card onboarding-form" [formGroup]="onboardingForm" (ngSubmit)="submitOnboarding()">
      @if (submitError(); as errMsg) {
        <div class="feedback-banner is-error" role="alert">{{ errMsg }}</div>
      }

      <section class="form-section">
        <h2 class="section-title">1. ข้อมูลพนักงานและสังกัด</h2>
        <div class="form-grid-2">
          <app-form-field label="รหัสพนักงาน" forId="ob-code" [required]="true" [control]="onboardingForm.controls.employeeCode">
            <input id="ob-code" type="text" class="form-control focus-ring" formControlName="employeeCode" placeholder="EMP-0010" />
          </app-form-field>
          <app-form-field label="สถานะเริ่มต้น" forId="ob-status" [required]="true" [control]="onboardingForm.controls.employmentStatus">
            <select id="ob-status" class="form-control focus-ring" formControlName="employmentStatus">
              <option value="PROBATION">ทดลองงาน</option>
              <option value="ACTIVE">ปฏิบัติงาน</option>
            </select>
          </app-form-field>
          <app-form-field label="ชื่อจริง" forId="ob-fn" [required]="true" [control]="onboardingForm.controls.firstName">
            <input id="ob-fn" type="text" class="form-control focus-ring" formControlName="firstName" />
          </app-form-field>
          <app-form-field label="นามสกุล" forId="ob-ln" [required]="true" [control]="onboardingForm.controls.lastName">
            <input id="ob-ln" type="text" class="form-control focus-ring" formControlName="lastName" />
          </app-form-field>
          <app-form-field label="สาขา" forId="ob-br" [required]="true" [control]="onboardingForm.controls.branchId">
            <select id="ob-br" class="form-control focus-ring" formControlName="branchId">
              @for (b of branches(); track b.id) { <option [value]="b.id">{{ b.name }}</option> }
            </select>
          </app-form-field>
          <app-form-field label="แผนก" forId="ob-dept" [required]="true" [control]="onboardingForm.controls.departmentId">
            <select id="ob-dept" class="form-control focus-ring" formControlName="departmentId">
              @for (d of departments(); track d.id) { <option [value]="d.id">{{ d.name }}</option> }
            </select>
          </app-form-field>
          <app-form-field label="ตำแหน่ง" forId="ob-pos" [required]="true" [control]="onboardingForm.controls.positionId">
            <select id="ob-pos" class="form-control focus-ring" formControlName="positionId">
              @for (p of positions(); track p.id) { <option [value]="p.id">{{ p.title }}</option> }
            </select>
          </app-form-field>
          <app-form-field label="ระดับพนักงาน" forId="ob-grade" [required]="true" [control]="onboardingForm.controls.jobGradeId">
            <select id="ob-grade" class="form-control focus-ring" formControlName="jobGradeId">
              @for (g of jobGrades(); track g.id) { <option [value]="g.id">{{ g.name }}</option> }
            </select>
          </app-form-field>
          <app-form-field label="วันเริ่มงาน" forId="ob-hire" [required]="true" [control]="onboardingForm.controls.hireDate">
            <input id="ob-hire" type="date" class="form-control focus-ring" formControlName="hireDate" />
          </app-form-field>
          <app-form-field label="วันครบกำหนดทดลองงาน (ถ้ามี)" forId="ob-prob" [control]="onboardingForm.controls.probationEndDate">
            <input id="ob-prob" type="date" class="form-control focus-ring" formControlName="probationEndDate" />
          </app-form-field>
        </div>
      </section>

      <section class="form-section">
        <h2 class="section-title">2. สัญญาจ้างและค่าตอบแทน</h2>
        <div class="form-grid-2">
          <app-form-field label="ประเภทสัญญา" forId="ob-ct" [required]="true" [control]="onboardingForm.controls.contractType">
            <select id="ob-ct" class="form-control focus-ring" formControlName="contractType">
              <option value="PROBATION">ทดลองงาน</option>
              <option value="PERMANENT">พนักงานประจำ</option>
              <option value="CONTRACT">สัญญาจ้าง</option>
            </select>
          </app-form-field>
          <app-form-field label="รอบจ่ายเงินเดือน" forId="ob-cycle" [required]="true" [control]="onboardingForm.controls.paymentCycle">
            <select id="ob-cycle" class="form-control focus-ring" formControlName="paymentCycle">
              <option value="MONTHLY">รายเดือน</option>
              <option value="BIWEEKLY">รายปักษ์</option>
            </select>
          </app-form-field>
          <app-form-field label="ฐานเงินเดือน (บาท)" forId="ob-sal" [required]="true" [control]="onboardingForm.controls.baseSalary">
            <input id="ob-sal" type="number" class="form-control focus-ring" formControlName="baseSalary" />
          </app-form-field>
        </div>
      </section>

      <section class="form-section">
        <h2 class="section-title">3. บัญชีผู้ใช้เข้าสู่ระบบ (ไม่บังคับ)</h2>
        <div class="form-grid-2">
          <app-form-field label="อีเมลเข้าสู่ระบบ" forId="ob-email" [control]="onboardingForm.controls.email">
            <input id="ob-email" type="email" class="form-control focus-ring" formControlName="email" placeholder="name@company.local" />
          </app-form-field>
          <app-form-field label="รหัสผ่านเริ่มต้น" forId="ob-pass" [control]="onboardingForm.controls.initialPassword">
            <input id="ob-pass" type="password" class="form-control focus-ring" formControlName="initialPassword" />
          </app-form-field>
        </div>
      </section>

      <div class="drawer-actions">
        <a routerLink="/employees/list" class="btn-secondary focus-ring link-btn">ยกเลิก</a>
        <button type="submit" class="btn-primary focus-ring" [disabled]="isSubmitting()">
          @if (isSubmitting()) { กำลังบันทึก... } @else { บันทึกรับพนักงานใหม่ }
        </button>
      </div>
    </form>
  </app-state-container>
</div>
